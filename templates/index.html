<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognevance AI Chatbot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eef1f7;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:min(480px,95vw);height:85vh;background:#fff;border-radius:16px;box-shadow:0 8px 30px #0002;display:flex;flex-direction:column;overflow:hidden}
header{background:#3b5bdb;color:#fff;padding:16px;font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.4}
.u{align-self:flex-end;background:#3b5bdb;color:#fff}.b{align-self:flex-start;background:#eef1f7}
.b small{display:block;color:#7a869a;font-size:11px;margin-top:4px}
.in{display:flex;border-top:1px solid #e3e7ef}.in input{flex:1;border:0;padding:14px;font-size:15px;outline:0}
.in button{border:0;background:#3b5bdb;color:#fff;padding:0 22px;cursor:pointer}
</style></head><body>
<div class="box"><header>Cognevance AI Chatbot (NLP)</header><div id="log"></div>
<div class="in"><input id="t" placeholder="Type a message..." autofocus><button onclick="send()">Send</button></div></div>
<script>
const log=document.getElementById("log"),t=document.getElementById("t");
function add(c,x,s){const d=document.createElement("div");d.className="m "+c;d.textContent=x;
 if(s){const e=document.createElement("small");e.textContent=s;d.appendChild(e)}log.appendChild(d);log.scrollTop=log.scrollHeight}
add("b","Hi! Ask me about AI, NLP, courses, submissions, or just chat.");
async function send(){const m=t.value.trim();if(!m)return;add("u",m);t.value="";
 const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});
 const j=await r.json();add("b",j.response,"intent: "+j.intent+" · confidence: "+(j.confidence*100).toFixed(0)+"%")}
t.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script></body></html>
